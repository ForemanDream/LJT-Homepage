name: Build and Deploy Jekyll Site

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unused starter pages and sample content
        run: |
          set -euo pipefail

          if [ -d _pages ]; then
            find _pages -maxdepth 1 -type f \
              ! -name '404.md' \
              ! -name 'about.md' \
              ! -name 'publications.html' \
              -print -delete
          fi

          rm -rf \
            _drafts \
            _portfolio \
            _posts \
            _publications \
            _talks \
            _teaching \
            files \
            images/themes \
            images/wiki \
            markdown_generator \
            scripts \
            talkmap

          rm -f \
            AGENTS.md \
            Dockerfile \
            _config_docker.yml \
            docker-compose.yaml \
            images/500x300.png \
            images/bio-photo-2.jpg \
            images/bio-photo.jpg \
            images/editing-talk.png \
            images/profile.png \
            package.json \
            talkmap.html \
            talkmap.ipynb \
            talkmap.py \
            talkmap_out.ipynb \
            .github/workflows/bad-pr.yml \
            .github/workflows/lock-closed-cron.yml \
            .github/workflows/scrape_talks.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No starter-content cleanup needed."
          else
            git commit -m "Remove remaining starter content from site build"
            git push origin HEAD:master
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          cache-version: 0

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Add Pages marker
        run: touch ./_site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy Junteng Liu homepage"

      - name: Configure GitHub Pages source (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" || true

          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" || true
